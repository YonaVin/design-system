<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: #0A0A0A; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(255,255,255,0.3); margin-bottom: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; border-radius: 999px;
    padding: 4px 11px; white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* Category — gray pill (as seen on site) */
  .badge-gray { background: #F0F0F0; color: #444; border: 1px solid rgba(0,0,0,0.08); }
  .badge-gray-dark { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.1); }

  /* Blue accent */
  .badge-blue { background: rgba(91,124,247,0.15); color: #5B7CF7; border: 1px solid rgba(91,124,247,0.25); }

  /* State */
  .badge-success { background: rgba(64,191,67,0.12); color: #2AA82D; border: 1px solid rgba(64,191,67,0.22); }
  .badge-danger  { background: rgba(255,36,36,0.1);  color: #CC1C1C; border: 1px solid rgba(255,36,36,0.18); }
  .badge-warning { background: rgba(255,152,34,0.12); color: #A05C00; border: 1px solid rgba(255,152,34,0.22); }

  /* Purple accent — from site's gradient */
  .badge-purple { background: rgba(139,92,246,0.15); color: #7C3AED; border: 1px solid rgba(139,92,246,0.22); }

  .light-bg { background: #F5F8FF; padding: 14px 16px; border-radius: 12px; }
</style>
</head><body>

  <div>
    <div class="label">Category Tags</div>
    <div class="row">
      <span class="badge badge-gray-dark">Development</span>
      <span class="badge badge-gray-dark">Infrastructure</span>
      <span class="badge badge-gray-dark">DeFi</span>
      <span class="badge badge-blue">Gurufin Chain</span>
      <span class="badge badge-purple">GX Stablecoin</span>
    </div>
  </div>

  <div>
    <div class="label">Status</div>
    <div class="row">
      <span class="badge badge-success"><span class="dot" style="background:#40BF43;"></span>Confirmed</span>
      <span class="badge badge-danger"><span class="dot" style="background:#FF2424;"></span>Failed</span>
      <span class="badge badge-warning"><span class="dot" style="background:#FF9822;"></span>Pending</span>
      <span class="badge badge-gray-dark">Archived</span>
    </div>
  </div>

  <div class="light-bg">
    <div class="label" style="color:rgba(0,0,0,0.3);">On Light</div>
    <div class="row">
      <span class="badge badge-gray">Development</span>
      <span class="badge badge-gray">Research</span>
      <span class="badge badge-success" style="background:rgba(64,191,67,0.1);color:#1F8C22;">Live</span>
      <span class="badge badge-blue" style="color:#3D5BD4;background:rgba(61,91,212,0.1);border-color:rgba(61,91,212,0.2);">New</span>
    </div>
  </div>

</body></html>
