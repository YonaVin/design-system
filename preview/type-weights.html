<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--color-paper); padding: 24px; color: var(--color-ink); }
  .row { display: flex; align-items: center; gap: 20px; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .label { width: 90px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-neutral-700); flex-shrink: 0; }
  .spec { font-size: 22px; line-height: 1.2; color: var(--color-ink); }
</style>
</head><body>
  <div class="row"><div class="label">Heavy 800</div><div class="spec" style="font-weight:800;">Gurufin Financial Infrastructure</div></div>
  <div class="row"><div class="label">Bold 700</div><div class="spec" style="font-weight:700;">Gurufin Financial Infrastructure</div></div>
  <div class="row"><div class="label">Regular 400</div><div class="spec" style="font-weight:400;">Gurufin Financial Infrastructure</div></div>
  <div class="row"><div class="label">Light 300</div><div class="spec" style="font-weight:300;">Gurufin Financial Infrastructure</div></div>
  <div class="row"><div class="label">Oblique</div><div class="spec" style="font-style:italic;font-weight:400;">Gurufin Financial Infrastructure</div></div>
</body></html>
