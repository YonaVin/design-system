<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Accent &amp; states — Gurufin palette</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: #F0F8FF; padding: 24px; color: #0A0A0A; }
  .label-row { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7280; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 88px; max-width: 160px; display: flex; flex-direction: column; }
  .color-block { height: 72px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.08); }
  .name { margin-top: 8px; font-size: 11px; font-weight: 700; }
  .hex { font-size: 10px; color: #6B7280; font-family: var(--font-mono); margin-top: 2px; }
</style>
</head><body>
<div class="label-row">Accent and states</div>
<div class="row">
  <div class="swatch">
    <div class="color-block" style="background:#0048FF;"></div>
    <div class="name">Signal Blue</div><div class="hex">#0048FF</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#40BF43;"></div>
    <div class="name">Success</div><div class="hex">#40BF43</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#FF2424;"></div>
    <div class="name">Danger</div><div class="hex">#FF2424</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#FF9822;"></div>
    <div class="name">Warning</div><div class="hex">#FF9822</div>
  </div>
</div>
</body></html>
