<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: var(--color-paper); padding: 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; flex: 1; min-width: 100px; }
  .color-block { height: 72px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.08); }
  .label { margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--color-neutral-900); letter-spacing: 0.03em; }
  .hex { font-size: 10px; color: var(--color-neutral-700); font-family: var(--font-mono); margin-top: 2px; }
</style>
</head><body>
<div class="row">
  <div class="swatch">
    <div class="color-block" style="background:#0A0A0A;"></div>
    <div class="label">Ink</div><div class="hex">#0A0A0A</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#0048FF;"></div>
    <div class="label">Signal Blue</div><div class="hex">#0048FF</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#0D4689;"></div>
    <div class="label">Brand Blue</div><div class="hex">#0D4689</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#4DA8DD;"></div>
    <div class="label">Sky Blue</div><div class="hex">#4DA8DD</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#070F1A;border-color:rgba(255,255,255,0.15);"></div>
    <div class="label">Dark 900</div><div class="hex">#070F1A</div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#F5F8FF;"></div>
    <div class="label">Surface</div><div class="hex">#F5F8FF</div>
  </div>
</div>
</body></html>
