<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); background: #0A0A0A; padding: 28px; display: flex; flex-direction: column; gap: 20px; }

  .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  /* Primary — blue-indigo pill */
  .btn {
    font-family: var(--font-sans); font-weight: 700; cursor: pointer;
    border: none; display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: #5B7CF7;
    color: #fff; font-size: 15px; padding: 11px 24px;
  }
  .btn-primary-sm { background: #5B7CF7; color: #fff; font-size: 13px; padding: 8px 18px; }

  /* White solid */
  .btn-white {
    background: #fff; color: #0A0A0A;
    font-size: 15px; padding: 11px 24px;
  }

  /* Ghost — white border on dark */
  .btn-ghost-dark {
    background: transparent; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.35);
    font-size: 15px; padding: 11px 24px;
  }

  /* Outlined on light */
  .btn-outline-light {
    background: transparent; color: #0A0A0A;
    border: 1.5px solid rgba(0,0,0,0.18);
    font-size: 15px; padding: 11px 24px;
  }

  /* Danger */
  .btn-danger { background: #FF2424; color: #fff; font-size: 15px; padding: 11px 24px; }

  /* Disabled */
  .btn-disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); font-size: 15px; padding: 11px 24px; cursor: not-allowed; }

  .light-bg { background: #F5F8FF; padding: 16px 20px; border-radius: 14px; }
  .arrow { font-size: 14px; }
</style>
</head><body>

  <div>
    <div class="label">Primary</div>
    <div class="row">
      <button class="btn btn-primary">WhitePaper <span class="arrow">→</span></button>
      <button class="btn btn-primary">Get Started <span class="arrow">→</span></button>
      <button class="btn btn-primary-sm">Learn More <span class="arrow">→</span></button>
    </div>
  </div>

  <div>
    <div class="label">On Dark</div>
    <div class="row">
      <button class="btn btn-ghost-dark">Quote, swap, and settle. Globally</button>
      <button class="btn btn-white">Discover GX STABLECOINS <span class="arrow">→</span></button>
    </div>
  </div>

  <div class="light-bg">
    <div class="label" style="color:rgba(0,0,0,0.35);">On Light</div>
    <div class="row">
      <button class="btn btn-primary">Connect Wallet <span class="arrow">→</span></button>
      <button class="btn btn-outline-light">Learn More</button>
      <button class="btn btn-disabled">Disabled</button>
    </div>
  </div>

</body></html>
