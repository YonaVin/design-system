<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gurufin — Brand Guidelines Presentation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: #F0F2F5;
    padding: 24px;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    border: 1px solid #E8E8E8;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    overflow: hidden;
    width: 100%;
    max-width: 680px;
  }
  .cover-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    cursor: pointer;
  }
  .cover-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.3s ease;
  }
  .cover-wrap:hover img { transform: scale(1.02); }
  .cover-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .cover-wrap:hover .cover-overlay { background: rgba(0,0,0,0.25); }
  .play-icon {
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s;
    background: rgba(255,255,255,0.95);
    border-radius: 50%; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .cover-wrap:hover .play-icon { opacity: 1; transform: scale(1); }

  .footer {
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-top: 1px solid #F0F0F0;
  }
  .info { display: flex; flex-direction: column; gap: 3px; }
  .title { font-size: 15px; font-weight: 700; color: #0A0A0A; letter-spacing: -0.01em; }
  .meta { font-size: 11px; color: #999; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 700;
    background: #0D4689; color: #fff; border: none;
    border-radius: 12px; padding: 10px 20px;
    text-decoration: none; white-space: nowrap;
    transition: opacity 0.15s; flex-shrink: 0;
  }
  .btn:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <a href="https://www.figma.com/slides/TUAIt7vh9z9GVeY0ztJjZe" target="_blank" class="cover-wrap">
      <img src="../assets/brand-guideline-ppt-cover.png" alt="Brand Style Guideline presentation cover">
      <div class="cover-overlay">
        <div class="play-icon">
          <svg width="20" height="20" fill="none" stroke="#0D4689" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13a6 6 0 0 1-6 6H5a6 6 0 0 1 0-12h3"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
        </div>
      </div>
    </a>
    <div class="footer">
      <div class="info">
        <div class="title">Brand Style Guideline</div>
        <div class="meta">Figma Slides · V1.0 — 2026 · Official brand system for GURUFIN</div>
      </div>
      <a class="btn" href="https://www.figma.com/slides/TUAIt7vh9z9GVeY0ztJjZe" target="_blank">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13a6 6 0 0 1-6 6H5a6 6 0 0 1 0-12h3"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
        Open in Figma
      </a>
    </div>
  </div>
</body>
</html>
