<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gurufin Email Signature</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: #F0F2F5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 24px;
  }

  .page-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #888; text-align: center;
  }

  /* ── SIGNATURE PREVIEW ── */
  .sig-preview {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    padding: 32px 40px;
    width: 100%;
    max-width: 640px;
  }

  /* ── COPY BOX ── */
  .copy-box {
    width: 100%; max-width: 640px;
    background: #1A1A2E;
    border-radius: 12px;
    overflow: hidden;
  }
  .copy-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: #16162A;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .copy-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.06em; }
  .copy-btn {
    font-family: var(--font-sans); font-size: 11px; font-weight: 700;
    background: #5B7CF7; color: #fff; border: none;
    border-radius: 6px; padding: 5px 12px; cursor: pointer;
    transition: opacity 0.15s;
  }
  .copy-btn:hover { opacity: 0.85; }
  .copy-code {
    font-family: "Courier New", monospace; font-size: 11px;
    color: rgba(255,255,255,0.55); line-height: 1.7;
    padding: 16px; white-space: pre-wrap; word-break: break-all;
    max-height: 200px; overflow-y: auto;
    user-select: all;
  }

  .variants-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #888; align-self: flex-start;
    max-width: 640px; width: 100%;
  }

  /* ── TWEAK PANEL ── */
  .tweaks {
    width: 100%; max-width: 640px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #E8E8E8;
    padding: 20px 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .tweak-row { display: flex; align-items: center; gap: 12px; }
  .tweak-label { font-size: 12px; font-weight: 700; color: #555; width: 100px; flex-shrink: 0; }
  .tweak-input {
    font-family: var(--font-sans); font-size: 13px; color: #0A0A0A;
    border: 1.5px solid #DFE0E4; border-radius: 8px; padding: 7px 12px;
    outline: none; flex: 1; transition: border-color 0.15s;
  }
  .tweak-input:focus { border-color: #5B7CF7; }
  .update-btn {
    font-family: var(--font-sans); font-size: 13px; font-weight: 700;
    background: #0D4689; color: #fff; border: none;
    border-radius: 99px; padding: 9px 20px; cursor: pointer;
    transition: opacity 0.15s; align-self: flex-end;
  }
  .update-btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="page-label">Gurufin Email Signature — Preview & Generator</div>

<!-- LIVE PREVIEW -->
<div class="sig-preview">
  <div id="sig-render"></div>
</div>

<!-- TWEAK PANEL -->
<div class="tweaks">
  <div class="tweak-row">
    <div class="tweak-label">Full Name</div>
    <input class="tweak-input" id="inp-name" value="Jack Reno">
  </div>
  <div class="tweak-row">
    <div class="tweak-label">Job Title</div>
    <input class="tweak-input" id="inp-title" value="Senior Manager">
  </div>
  <div class="tweak-row">
    <div class="tweak-label">Email</div>
    <input class="tweak-input" id="inp-email" value="jack@gurufin.com">
  </div>
  <div class="tweak-row">
    <div class="tweak-label">Phone</div>
    <input class="tweak-input" id="inp-phone" value="+82 010 XXXX XXXX">
  </div>
  <button class="update-btn" onclick="render()">Update Signature</button>
</div>

<!-- COPY BOX -->
<div class="copy-box">
  <div class="copy-header">
    <span class="copy-title">HTML — copy &amp; paste into email client</span>
    <div style="display:flex;gap:8px;">
      <button class="copy-btn" style="background:#363E49;" onclick="downloadPNG()">Download PNG</button>
      <button class="copy-btn" onclick="copyHTML()">Copy HTML</button>
    </div>
  </div>
  <div class="copy-code" id="code-output"></div>
</div>

<script>
const MARK_SVG = `<svg width="28" height="32" viewBox="0 0 184 212" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M92.9587 212L184 160.197V54.6786L92.9587 0L0 54.6786V170.752L46.0002 142.932L92.9587 170.752L144.71 141.013V66.1899L55.5836 118.95V87.2937L92.9587 66.1899V44.1266L36.4168 75.7824V128.543L18.2085 139.095V66.1899L92.9587 21.104L165.792 66.1899V149.646L92.9587 192.813V212ZM64.2087 133.339L127.459 95.9272V128.543L92.0004 149.646L64.2087 133.339Z" fill="#0D4689"/></svg>`;

function buildHTML(name, title, email, phone) {
  return `<table cellpadding="0" cellspacing="0" border="0" style="font-family:Helvetica,Arial,sans-serif;background:#ffffff;">
  <tr>
    <!-- LEFT: mark + GURUFIN -->
    <td style="padding:14px 20px 14px 0;vertical-align:middle;text-align:center;white-space:nowrap;">
      <svg width="25" height="29" viewBox="0 0 184 212" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M92.9587 212L184 160.197V54.6786L92.9587 0L0 54.6786V170.752L46.0002 142.932L92.9587 170.752L144.71 141.013V66.1899L55.5836 118.95V87.2937L92.9587 66.1899V44.1266L36.4168 75.7824V128.543L18.2085 139.095V66.1899L92.9587 21.104L165.792 66.1899V149.646L92.9587 192.813V212ZM64.2087 133.339L127.459 95.9272V128.543L92.0004 149.646L64.2087 133.339Z" fill="#0D4689"/></svg>
      <div style="margin-top:5px;font-size:7.5px;font-weight:700;letter-spacing:0.18em;color:#0D4689;text-transform:uppercase;">GURUFIN</div>
    </td>
    <!-- RIGHT: all text, no divider -->
    <td style="padding:14px 0;vertical-align:middle;">
      <div style="font-size:13px;color:#0A0A0A;line-height:1.3;">
        <strong>${name}</strong> <span style="font-weight:400;color:#444;">| ${title}</span>
      </div>
      <div style="font-size:11px;color:#888888;margin-top:4px;">11, Yeoksam-ro 3-gil, Gangnam-gu, Seoul 9th floor</div>
      <div style="font-size:11px;color:#444444;margin-top:6px;white-space:nowrap;">
        <span style="font-weight:700;color:#0D4689;">W</span>&nbsp;<a href="https://www.gurufin.com" style="color:#444444;text-decoration:none;">www.gurufin.com</a>
        &nbsp;&nbsp;
        <span style="font-weight:700;color:#0D4689;">E</span>&nbsp;<a href="mailto:${email}" style="color:#444444;text-decoration:none;">${email}</a>
        &nbsp;&nbsp;
        <span style="font-weight:700;color:#0D4689;">M</span>&nbsp;${phone}
      </div>
    </td>
  </tr>
</table>`;
}

function render() {
  const name  = document.getElementById('inp-name').value  || 'Jack Reno';
  const title = document.getElementById('inp-title').value || 'Senior Manager';
  const email = document.getElementById('inp-email').value || 'jack@gurufin.com';
  const phone = document.getElementById('inp-phone').value || '+82 010 XXXX XXXX';

  const html = buildHTML(name, title, email, phone);
  document.getElementById('sig-render').innerHTML = html;
  document.getElementById('code-output').textContent = html;

  // persist
  localStorage.setItem('sig_name', name);
  localStorage.setItem('sig_title', title);
  localStorage.setItem('sig_email', email);
  localStorage.setItem('sig_phone', phone);
}

async function downloadPNG() {
  const el = document.getElementById('sig-render');
  const btn = document.querySelector('[onclick="downloadPNG()"]');
  btn.textContent = 'Generating…';
  try {
    const canvas = await html2canvas(el, {
      backgroundColor: '#ffffff',
      scale: 3,
      useCORS: true,
      logging: false,
    });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    const name = document.getElementById('inp-name').value || 'signature';
    a.download = 'gurufin-signature-' + name.toLowerCase().replace(/\s+/g,'-') + '.png';
    a.click();
  } catch(e) {
    alert('PNG export failed: ' + e.message);
  }
  btn.textContent = 'Download PNG';
}

function copyHTML() {
  const code = document.getElementById('code-output').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy HTML', 2000);
  });
}

// Restore from localStorage
const saved = {
  name:  localStorage.getItem('sig_name'),
  title: localStorage.getItem('sig_title'),
  email: localStorage.getItem('sig_email'),
  phone: localStorage.getItem('sig_phone'),
};
if (saved.name)  document.getElementById('inp-name').value  = saved.name;
if (saved.title) document.getElementById('inp-title').value = saved.title;
if (saved.email) document.getElementById('inp-email').value = saved.email;
if (saved.phone) document.getElementById('inp-phone').value = saved.phone;

render();
</script>
</body>
</html>
